<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings 7in mock</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
/* 800x480 CrowPanel 7", Montserrat Medium only, flat fills (RGB565). Section
   icons stand in for LVGL's built-in symbols (image, eye-close, bell, wifi, settings). */
:root{
  --ground:#06090E; --plate:#0E141D; --raised:#132030; --seam:#1E2A38;
  --ink:#E6EDF3; --ink2:#B3C1CF; --ink3:#7E8C9B; --ink4:#2A3644;
  --accent:#22D3EE; --err:#FF5C6C; --ok:#2EE59D;
}
*{box-sizing:border-box;margin:0}
body{background:#222;font-family:Montserrat,sans-serif;font-weight:500;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px;-webkit-font-smoothing:antialiased}
.panel{position:relative;width:800px;height:480px;background:var(--ground);overflow:hidden;flex:none}
.abs{position:absolute}
.title{left:16px;top:13px;font-size:20px;line-height:24px}
.back{right:16px;top:8px;height:34px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:16px;
  border:1px solid var(--seam);border-radius:6px;background:var(--plate)}
/* left: sections */
.rail{left:16px;top:52px;width:236px;height:406px;display:flex;flex-direction:column;gap:6px}
.sec{position:relative;height:76px;border-radius:10px;display:flex;align-items:center;gap:14px;padding:0 16px;border:1px solid transparent}
.sec svg{width:24px;height:24px;flex:none;color:var(--ink3)}
.sec .n{font-size:17px}
.sec .s{font-size:13px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.sec.on{background:var(--plate);border-color:var(--seam)}
.sec.on svg{color:var(--accent)}
.sec.on:before{content:"";position:absolute;left:-1px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--accent)}
/* right: rows */
.pane{left:262px;top:52px;width:522px;height:406px;background:var(--plate);border:1px solid var(--seam);border-radius:10px;padding:6px 20px}
.r{height:66px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--seam)}
.r:last-child{border-bottom:none}
.r .l{flex:1;font-size:17px}
.r .h{font-size:13px;color:var(--ink3);margin-top:4px}
.r .v{font-size:17px;color:var(--ink2)}
.r .c{color:var(--ink3);font-size:16px;width:12px;text-align:right}
.r.info .l{color:var(--ink2)}
.r.danger .l{color:var(--err)}
.sw{width:52px;height:30px;border-radius:15px;background:var(--ink4);position:relative}
.sw:after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
.sw.on{background:var(--accent)}.sw.on:after{left:26px}
.note{color:#bbb;font:13px/1.4 system-ui;width:800px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-disp" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-quiet" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="19.5" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-dev" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<template id="frame">
<div class="panel">
  <div class="abs title">Settings</div>
  <div class="abs back">&#8249;&nbsp; Back</div>
  <div class="abs rail" data-rail></div>
  <div class="abs pane" data-pane></div>
</div>
</template>

<p class="note">Display open.</p><div id="a"></div>
<p class="note">Alerts open.</p><div id="b"></div>
<p class="note">Device open.</p><div id="c"></div>

<script>
const SECS = [
  ['disp','Display','80%  ·  dim after 5 min'],
  ['quiet','Quiet hours','Off'],
  ['bell','Alerts','Everything  ·  sound on'],
  ['wifi','Network','wofl  ·  poll every 10 min'],
  ['dev','Device','v0.4.140'],
];
const ROWS = {
  disp: [['Brightness','80%'],['Dim after','5 min'],['Flip display',null,'If the panel is mounted upside down',false],['Auto-cycle screens','Off'],['Return to Today','after 60 s']],
  bell: [['Notify on','Everything','Banner and chime for these events'],['Notification time','8 s'],['Sound',null,null,true],['Volume','Medium']],
  dev:  [['Firmware','v0.4.140'],['Status',''],['About',''],['Reset settings','',null,undefined,'danger']],
};
function make(id, open){
  const host=document.getElementById(id);
  host.appendChild(document.getElementById('frame').content.cloneNode(true));
  host.querySelector('[data-rail]').innerHTML = SECS.map(([k,n,s])=>
    `<div class="sec ${k===open?'on':''}"><svg><use href="#i-${k}"/></svg><div><div class="n">${n}</div><div class="s">${s}</div></div></div>`).join('');
  host.querySelector('[data-pane]').innerHTML = ROWS[open].map(([l,v,h,sw,cls])=>
    `<div class="r ${cls||''}"><div class="l">${l}${h?`<div class="h">${h}</div>`:''}</div>`+
    (sw!==undefined && v===null ? `<div class="sw ${sw?'on':''}"></div>` : `<div class="v">${v}</div><div class="c">&#8250;</div>`)+`</div>`).join('');
}
make('a','disp'); make('b','bell'); make('c','dev');
</script>
</body>
</html>
