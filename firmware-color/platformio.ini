; One env per board. Build with e.g. `pio run -e crowpanel_70 -t upload`.
; Needs Arduino-ESP32 3.x for the esp_lcd RGB driver, so use the pioarduino platform.
; platformio_override.ini is optional and gitignored (private upload targets).
[platformio]
extra_configs = platformio_override.ini
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  ; Every update path ends in esp_ota_set_boot_partition; main.cpp wraps it.
  -Wl,--wrap=esp_ota_set_boot_partition
lib_deps =
  lvgl/lvgl @ 8.3.11
  bblanchon/ArduinoJson @ ^7

; Waveshare ESP32-S3-LCD-3.16 (320x820 ST7701 RGB, 16MB flash, 8MB octal PSRAM), knob
[env:ws316]
extends = base
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; The RGB VSYNC ISR restarts GDMA. gdma_hal_append still lives in flash, so that
; ISR must be masked while a flash write (NVS, LittleFS, OTA) has the cache off.
; Otherwise the panel reboots and the dashboard comes back empty.
custom_sdkconfig =
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=n
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y
build_flags =
  ${base.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911, CH422G expander, 16MB
; flash, 8MB octal PSRAM, native USB). Same XIP setup as the CrowPanel 7", so
; the display keeps running during updates; no speaker, so no I2S settings.
[env:waveshare_70]
extends = base
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
custom_sdkconfig =
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=n
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  CONFIG_LWIP_IPV6=n
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
build_flags =
  ${base.build_flags}
  -DBOARD_WAVESHARE_70
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Guition JC3248W535 (3.5" 320x480 QSPI AXS15231B with its own GRAM, touch in
; the same chip, 16MB flash, 8MB octal PSRAM, native USB). The panel keeps its
; picture without the ESP32, so no XIP or RGB settings; updates show the
; notice and the screen goes dark like the Waveshare 3.16.
[env:jc3248w535]
extends = base
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
custom_sdkconfig =
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_LWIP_IPV6=n
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
  ; The speaker's GDMA ISR needs its I2S channel in internal RAM.
  CONFIG_I2S_ISR_IRAM_SAFE=y
build_flags =
  ${base.build_flags}
  -DBOARD_JC3248W535
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Touch-LCD-2 (2" 240x320 SPI ST7789T3 with its own GRAM,
; CST816D touch, 16MB flash, 8MB octal PSRAM, native USB). No speaker; the
; panel keeps its picture through flash writes like the Guition 3.5.
[env:ws_lcd2]
extends = base
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
custom_sdkconfig =
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_LWIP_IPV6=n
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
build_flags =
  ${base.build_flags}
  -DBOARD_WS_LCD2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; WiFi upload after the first USB flash. The panel's hostname is
; makermonitor-xxxxx.local, shown on Status. Point upload_port at that
; name or the panel IP from platformio_override.ini.
[env:ws316_ota]
extends = env:ws316
custom_sdkconfig = ${env:ws316.custom_sdkconfig}
upload_protocol = espota
upload_port = makermonitor.local

; Elecrow CrowPanel ESP32-S3 HMI: 4MB flash, USB-C via a USB-UART bridge,
; touchscreen. min_spiffs keeps two OTA slots of 1.9MB.
[crowpanel]
extends = base
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
; The RGB VSYNC ISR restarts GDMA. gdma_hal_append still lives in flash, so that
; ISR must be masked while a flash write (NVS, LittleFS, OTA) has the cache off.
; Otherwise the panel reboots and the dashboard comes back empty.
custom_sdkconfig =
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=n
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=n
  CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  ; IPv4 is all the LAN needs; IPv6 costs about 20 KB of a 1.9 MB app slot.
  CONFIG_LWIP_IPV6=n
  ; Wi-Fi setup only takes a network name and password, so no WPA2/3-Enterprise.
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
build_flags =
  ${base.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

; 4.3" 480x272, resistive touch, N4R2 (2MB quad PSRAM)
[env:crowpanel_43]
extends = crowpanel
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags = ${crowpanel.build_flags} -DBOARD_CROWPANEL_43

; 5.0" 800x480, capacitive touch, N4R8 (8MB octal PSRAM)
[env:crowpanel_50]
extends = crowpanel
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = ${crowpanel.build_flags} -DBOARD_CROWPANEL_50
custom_sdkconfig =
  ${crowpanel.custom_sdkconfig}
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y

; 7.0" 800x480, capacitive touch, N4R8 (8MB octal PSRAM)
[env:crowpanel_70]
extends = crowpanel
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = ${crowpanel.build_flags} -DBOARD_CROWPANEL_70
; I2S_ISR_IRAM_SAFE: the speaker's GDMA ISR needs its I2S channel in internal RAM.
; SPIRAM_XIP_FROM_PSRAM: code and read-only data run from PSRAM, so flash writes
; (OTA, NVS, LittleFS) no longer switch the cache off and the display keeps
; running through an update. RESTART_IN_VSYNC re-syncs the RGB DMA each frame
; if PSRAM traffic ever makes it fall behind.
custom_sdkconfig =
  ${crowpanel.custom_sdkconfig}
  CONFIG_SPIRAM_MODE_QUAD=n
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_I2S_ISR_IRAM_SAFE=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y

; WiFi uploads for the CrowPanels. Hostname is makermonitor-xxxxx.local.
; OTA password is optional and stored on the panel, not in this file.
[crowpanel_ota]
upload_protocol = espota

[env:crowpanel_43_ota]
extends = env:crowpanel_43, crowpanel_ota
custom_sdkconfig = ${env:crowpanel_43.custom_sdkconfig}
upload_port = makermonitor.local

[env:crowpanel_50_ota]
extends = env:crowpanel_50, crowpanel_ota
custom_sdkconfig = ${env:crowpanel_50.custom_sdkconfig}
upload_port = makermonitor.local

[env:crowpanel_70_ota]
extends = env:crowpanel_70, crowpanel_ota
custom_sdkconfig = ${env:crowpanel_70.custom_sdkconfig}
upload_port = makermonitor.local
