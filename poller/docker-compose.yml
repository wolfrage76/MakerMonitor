# docker compose up -d   pulls the prebuilt image; --build builds this folder instead.
# This file works on its own too: download it into an empty folder. See README "Setup".
services:
  poller:
    image: ghcr.io/wolfrage76/makermonitor-poller:latest
    build: .
    container_name: makermonitor-poller
    restart: unless-stopped
    # Host networking: the panels fetch from the poller's LAN address, and
    # .local panel names resolve through the host.
    network_mode: host
    # Run as your user so ./docker-data stays editable (MM_UID=$(id -u) MM_GID=$(id -g)).
    user: "${MM_UID:-1000}:${MM_GID:-1000}"
    environment:
      MM_HANDLE: "${MM_HANDLE:-}"     # first run only: your MakerWorld handle for the new config.yaml
      TZ: "${TZ:-America/New_York}"   # "today", daily stats and quiet hours use this time zone
    volumes:
      - ./docker-data:/config         # config.yaml + data/ (cookie, history, logs)
      # .local panel names resolve through the host's Avahi (avahi-daemon must be running).
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket
