; Elecrow CrowPanel ESP32-S3 2.13" e-paper (DIE01021S)
; Use Arduino-ESP32 2.x (platform 6.5.0) — closer to Elecrow factory builds.
; Native USB OFF: GPIO19 is the red LED on this board.
; platformio_override.ini is optional and gitignored (private IP / OTA password).
[platformio]
extra_configs = platformio_override.ini
[env:crowpanel_213]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson @ ^7
  tzapu/WiFiManager @ ^2.0.17
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0

; WiFi upload. The board already has two app slots (default_8MB.csv).
; Hostname comes from ArduinoOTA. Add --auth in platformio_override.ini
; only when include/ota_secret_local.h sets a password.
[env:crowpanel_213_ota]
extends = env:crowpanel_213
upload_protocol = espota
upload_port = makermonitor.local
